name: APK Build (Unified Key Debug & Release)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Rust Core & Debug/Release APKs (Same Key)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Detect or Install Android NDK
        run: |
          NDK_DIR=$(ls -d "$ANDROID_SDK_ROOT/ndk"/* 2>/dev/null | sort -V | tail -n1)
          if [ -z "$NDK_DIR" ]; then
            echo "Installing NDK via sdkmanager..."
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
            NDK_DIR="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          fi
          echo "Selected NDK directory: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo Registry & Target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/**/Cargo.toml') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust Core (libobtainmond_core.so) for all ABIs
        run: |
          mkdir -p app/src/main/jniLibs
          cd native
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86 \
            -t x86_64 \
            --platform 26 \
            -o ../app/src/main/jniLibs \
            build --release -p obtainmond-core
          ls -lh ../app/src/main/jniLibs/*/libobtainmond_core.so

      - name: Configure Unified Signing Key (Same Key for Debug & Release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Using configured repository signing keystore for both Debug and Release APKs"
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
            cat <<EOF > signing.properties
          KEYSTORE_FILE=keystore.jks
          KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          KEY_ALIAS=$KEY_ALIAS
          KEY_PASSWORD=$KEY_PASSWORD
          EOF
          else
            echo "Generating deterministic unified keystore for both Debug and Release APKs"
            keytool -genkeypair -v \
              -keystore keystore.jks \
              -storetype PKCS12 \
              -alias obtainmond \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass obtainmond123 \
              -keypass obtainmond123 \
              -dname "CN=Obtainmond, OU=HmnDev-Tech, O=Obtainmond, L=Almaty, S=KZ, C=KZ"
            cat <<EOF > signing.properties
          KEYSTORE_FILE=keystore.jks
          KEYSTORE_PASSWORD=obtainmond123
          KEY_ALIAS=obtainmond
          KEY_PASSWORD=obtainmond123
          EOF
          fi

      - name: Build Debug & Release APKs
        env:
          SKIP_GRADLE_RUST_BUILD: "true"
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Verify Identical Signing Certificate Across Debug & Release APKs
        run: |
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n1)
          echo "Using apksigner: $APKSIGNER"
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            echo "=== Verifying $apk ==="
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: obtainmond-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: obtainmond-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
