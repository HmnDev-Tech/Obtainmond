name: APK Build (Unified Key Debug & Release)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Rust Core & Debug/Release APKs (Same Key)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 37 & NDK 29
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865"

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo & Rust Target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/**/Cargo.toml') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust Core (libobtainmond_core.so) for all ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          mkdir -p app/src/main/jniLibs
          cd native
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86 \
            -t x86_64 \
            --platform 26 \
            -o ../app/src/main/jniLibs \
            build --release -p obtainmond-core
          ls -lh ../app/src/main/jniLibs/*/libobtainmond_core.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Unified Signing Key (Same Key for Debug & Release)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_KEYSTORE_PASSWORD" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "Using repository signing keystore for both Debug and Release APKs"
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > keystore.jks
            cat <<EOF > signing.properties
          KEYSTORE_FILE=keystore.jks
          KEYSTORE_PASSWORD=$SIGNING_KEYSTORE_PASSWORD
          KEY_ALIAS=$SIGNING_KEY_ALIAS
          KEY_PASSWORD=$SIGNING_KEY_PASSWORD
          EOF
          else
            echo "Generating deterministic unified keystore for both Debug and Release APKs"
            keytool -genkeypair -v \
              -keystore keystore.jks \
              -storetype PKCS12 \
              -alias obtainmond \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass obtainmond123 \
              -keypass obtainmond123 \
              -dname "CN=Obtainmond, OU=HmnDev-Tech, O=Obtainmond, L=Almaty, S=KZ, C=KZ"
            cat <<EOF > signing.properties
          KEYSTORE_FILE=keystore.jks
          KEYSTORE_PASSWORD=obtainmond123
          KEY_ALIAS=obtainmond
          KEY_PASSWORD=obtainmond123
          EOF
          fi

      - name: Build Debug & Release APKs
        env:
          SKIP_GRADLE_RUST_BUILD: "true"
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Verify Identical Signing Certificate Across Debug & Release APKs
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/37.0.0/apksigner"
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            echo "=== Verifying $apk ==="
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: obtainmond-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: obtainmond-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
