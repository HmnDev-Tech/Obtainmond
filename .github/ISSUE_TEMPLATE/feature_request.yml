name: Feature Request
description: Suggest an idea, enhancement, or new Lab feature for Obtainmond
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Obtainmond better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What limitation or problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - "Rust Core Engine (Version / ABI Selector / Source Parser)"
        - "Zero-Touch Background Auto-Update"
        - "Shevery-API / Shizuku Privileged Operations"
        - "Obtainmond Labs (Experimental / Power-User Feature)"
        - "Material 3 Expressive UI & Animations"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
