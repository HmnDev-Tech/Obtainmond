name: Bug Report
description: Report a bug, crash, or unexpected behavior in Obtainmond
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open Obtainmond
        2. Add app URL '...'
        3. Trigger background update
        4. See error
    validations:
      required: true
  - type: input
    id: app_url
    attributes:
      label: App URL Being Tracked
      description: The release/repository URL of the affected application (if applicable).
      placeholder: https://github.com/owner/repo
  - type: dropdown
    id: privilege_backend
    attributes:
      label: Active Privilege Backend
      description: Which privilege backend is currently granted in Obtainmond?
      options:
        - "Shevery-API v14.6.4 (Root)"
        - "Shevery-API v14.6.4 (ADB)"
        - "Shizuku Legacy Binder"
        - "Root (su)"
        - "Unprivileged (Standard Installer)"
    validations:
      required: true
  - type: input
    id: device_info
    attributes:
      label: Device & OS
      description: Device manufacturer, model, and Android version.
      placeholder: "Google Pixel 8, Android 15 (API 35), arm64-v8a"
    validations:
      required: true
  - type: input
    id: obtainmond_version
    attributes:
      label: Obtainmond Version / Commit
      placeholder: "v2.0.0-rust (commit 9964f26)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Audit Telemetry
      description: Paste any error messages or entries from the 'Settings & Telemetry' audit logs.
      render: shell
