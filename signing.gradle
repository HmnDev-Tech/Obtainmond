// Shared signing configuration for Obtainmond
// Signs BOTH debug and release variants with the exact same key so users can
// install debug over release (and vice-versa) without ever uninstalling.

android {
    signingConfigs {
        sign
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.sign
        }
        release {
            signingConfig signingConfigs.sign
        }
    }
}

Properties props = new Properties()
def propFile = rootProject.file('signing.properties')

if (propFile.canRead()) {
    props.load(new FileInputStream(propFile))

    if (props != null &&
        props.containsKey('KEYSTORE_FILE') &&
        props.containsKey('KEYSTORE_PASSWORD') &&
        props.containsKey('KEY_ALIAS') &&
        props.containsKey('KEY_PASSWORD')) {

        android.signingConfigs.sign.storeFile = rootProject.file(props['KEYSTORE_FILE'])
        android.signingConfigs.sign.storePassword = props['KEYSTORE_PASSWORD']
        android.signingConfigs.sign.keyAlias = props['KEY_ALIAS']
        android.signingConfigs.sign.keyPassword = props['KEY_PASSWORD']
    } else {
        android.signingConfigs.sign.initWith(android.signingConfigs.debug)
    }
} else {
    android.signingConfigs.sign.initWith(android.signingConfigs.debug)
}
