def resolveKeystorePath = { String ksPath ->
    if (ksPath == null || ksPath.isBlank()) {
        return null
    }
    def direct = new File(ksPath)
    if (direct.isAbsolute() && direct.exists()) {
        return direct
    }
    def fromRoot = rootProject.file(ksPath)
    if (fromRoot.exists()) {
        return fromRoot
    }
    def fromProject = file(ksPath)
    return fromProject.exists() ? fromProject : fromRoot
}

def props = new Properties()
def ksFile = rootProject.file('signing.properties')
if (ksFile.canRead()) {
    ksFile.withInputStream { stream -> props.load(stream) }
}

def envOrProp = { List<String> keys ->
    for (String key : keys) {
        def p = props.getProperty(key)
        if (p != null && !p.isBlank()) {
            return p.trim()
        }
        def e = System.getenv(key)
        if (e != null && !e.isBlank()) {
            return e.trim()
        }
    }
    return null
}

def ksPath = envOrProp(['KEYSTORE_FILE', 'SIGNING_KEYSTORE_FILE'])
def ksBase64 = envOrProp(['KEYSTORE_BASE64', 'SIGNING_KEYSTORE_BASE64'])
def storePass = envOrProp(['KEYSTORE_PASSWORD', 'SIGNING_STORE_PASSWORD', 'SIGNING_KEYSTORE_PASSWORD'])
def keyAliasVal = envOrProp(['KEY_ALIAS', 'KEYSTORE_ALIAS', 'SIGNING_KEY_ALIAS'])
def keyPass = envOrProp(['KEY_PASSWORD', 'KEYSTORE_ALIAS_PASSWORD', 'SIGNING_KEY_PASSWORD'])

File targetKeystore = resolveKeystorePath(ksPath)
if ((targetKeystore == null || !targetKeystore.exists()) && ksBase64 != null) {
    def decoded = java.util.Base64.decoder.decode(ksBase64.replaceAll('\\s+', ''))
    def envKeystore = new File(rootProject.layout.buildDirectory.asFile.get(), 'signing/env-keystore.jks')
    envKeystore.parentFile.mkdirs()
    if (!envKeystore.exists() || !java.util.Arrays.equals(envKeystore.bytes, decoded)) {
        envKeystore.bytes = decoded
    }
    targetKeystore = envKeystore
}

def hasSigningConfig = (targetKeystore != null && targetKeystore.exists() && keyAliasVal != null && storePass != null)

if (hasSigningConfig) {
    android.signingConfigs.sign.storeFile = targetKeystore
    android.signingConfigs.sign.storePassword = storePass
    android.signingConfigs.sign.keyAlias = keyAliasVal
    android.signingConfigs.sign.keyPassword = (keyPass ?: storePass)
    android.signingConfigs.sign.enableV1Signing = true
    android.signingConfigs.sign.enableV2Signing = true
    android.signingConfigs.sign.enableV3Signing = true
    android.buildTypes.debug.signingConfig = android.signingConfigs.sign
    android.buildTypes.release.signingConfig = android.signingConfigs.sign
} else {
    android.buildTypes.debug.signingConfig = android.signingConfigs.debug
    android.buildTypes.release.signingConfig = null
}

def missingConfigMessage = "Release signing is not configured. Provide signing.properties (KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) or set KEYSTORE_FILE / KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD environment variables."

rootProject.ext.releaseSigningConfigured = hasSigningConfig

gradle.taskGraph.whenReady { graph ->
    def needsReleaseSigning = graph.allTasks.any { t ->
        t.project == project && t.name in ['packageRelease', 'assembleRelease', 'bundleRelease', 'packageReleaseBundle']
    }
    if (needsReleaseSigning && !hasSigningConfig) {
        throw new GradleException(missingConfigMessage)
    }
}

tasks.matching {
    it.name in ['validateSigningRelease', 'packageRelease', 'assembleRelease', 'bundleRelease']
}.configureEach {
    doFirst {
        if (!hasSigningConfig) {
            throw new GradleException(missingConfigMessage)
        }
    }
}
