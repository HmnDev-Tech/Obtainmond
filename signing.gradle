def ksFile = rootProject.file('signing.properties')
def props = new Properties()

if (ksFile.canRead()) {
    props.load(new FileInputStream(ksFile))

    def ksPath = props['KEYSTORE_FILE']
    File targetKeystore = null
    if (ksPath != null && !ksPath.isBlank()) {
        def f1 = new File(ksPath)
        if (f1.isAbsolute() && f1.exists()) {
            targetKeystore = f1
        } else {
            def fRoot = rootProject.file(ksPath)
            if (fRoot.exists()) {
                targetKeystore = fRoot
            } else {
                def fLocal = file(ksPath)
                if (fLocal.exists()) {
                    targetKeystore = fLocal
                } else {
                    targetKeystore = fRoot
                }
            }
        }
    }

    def keyAlias = props['KEY_ALIAS'] ?: props['KEYSTORE_ALIAS']
    def keyPass = props['KEY_PASSWORD'] ?: props['KEYSTORE_ALIAS_PASSWORD']
    def storePass = props['KEYSTORE_PASSWORD'] ?: props['SIGNING_STORE_PASSWORD']

    if (targetKeystore != null && targetKeystore.exists() && keyAlias != null && storePass != null) {
        android.signingConfigs.sign.storeFile targetKeystore
        android.signingConfigs.sign.storePassword storePass
        android.signingConfigs.sign.keyAlias keyAlias
        android.signingConfigs.sign.keyPassword (keyPass ?: storePass)
    } else {
        android.signingConfigs.sign.initWith(android.signingConfigs.debug)
    }
} else {
    android.signingConfigs.sign.initWith(android.signingConfigs.debug)
}

android.signingConfigs.sign.enableV1Signing = true
android.signingConfigs.sign.enableV2Signing = true
android.signingConfigs.sign.enableV3Signing = true
